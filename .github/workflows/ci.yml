name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: "3.11"

      - name: Install project with dev tools
        run: python -m pip install -e ".[dev]"

      - name: Run pytest
        env:
          LLM_LOCAL_DATA_DIR: /tmp/llm-local-ci-data
        run: python -m pytest -v --tb=short

  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: "3.11"

      - name: Install project with dev tools
        run: python -m pip install -e ".[dev]"

      - name: Compile Python files
        run: python -m compileall src tests

      - name: Ruff
        run: ruff check src tests

      - name: Bandit
        run: |
          bandit -r src \
            -x .venv,venv,__pycache__,.git,artifacts,data/state,node_modules

  scripts:
    name: Scripts and repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install shell tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          python -m pip install yamllint --quiet

      - name: Lint shell scripts
        run: |
          shellcheck -S warning bootstrap.sh
          find scripts/ -name "*.sh" 2>/dev/null \
            | while read -r f; do
              echo "Checking $f"
              shellcheck -S warning "$f"
            done

      - name: Validate JSON files
        run: |
          find . -name "*.json" \
            ! -path "./.git/*" \
            ! -path "./.venv/*" \
            ! -path "./venv/*" \
            ! -path "./node_modules/*" \
            ! -path "./artifacts/*" \
            ! -path "./data/state/*" \
            | while read -r f; do
              echo "Validating $f"
              python -m json.tool "$f" > /dev/null
            done

      - name: Validate YAML files outside workflows
        run: |
          find . -name "*.yml" \
            ! -path "./.git/*" \
            ! -path "./.github/workflows/*" \
            ! -path "./.venv/*" \
            ! -path "./venv/*" \
            ! -path "./node_modules/*" \
            ! -path "./artifacts/*" \
            ! -path "./data/state/*" \
            | while read -r f; do
              echo "Checking $f"
              yamllint -d relaxed "$f"
            done

      - name: Validate docker-compose.yml syntax
        run: docker compose config --quiet

      - name: Check no privileged containers
        run: |
          if grep -q "privileged: true" docker-compose.yml; then
            echo "ERREUR : container privileged detecte"
            exit 1
          fi
          echo "OK : aucun container privileged"

      - name: Check required files
        run: |
          for f in bootstrap.sh docker-compose.yml deploy-windows.ps1 README.md; do
            [ -f "$f" ] && echo "OK : $f" || { echo "MANQUANT : $f"; exit 1; }
          done
