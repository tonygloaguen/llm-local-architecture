name: Security

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

jobs:
  gitleaks:
    name: Gitleaks secrets scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Install Gitleaks CLI
        run: |
          GITLEAKS_VERSION="8.26.0"
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          chmod +x /usr/local/bin/gitleaks
          gitleaks version

      - name: Run Gitleaks
        run: |
          gitleaks detect \
            --source . \
            --log-opts="--all" \
            --redact \
            --exit-code 1 \
            --report-format json \
            --report-path gitleaks-report.json

      - name: Upload Gitleaks report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
        continue-on-error: true

  dependency-audit:
    name: pip-audit dependency scan
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: python -m pip install pip-audit --quiet

      - name: Audit Python project
        run: pip-audit .

  iac-scan:
    name: Checkov IaC scan
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install Checkov
        run: python -m pip install checkov --quiet

      - name: Scan docker-compose.yml
        run: |
          checkov -f docker-compose.yml \
            --framework docker_compose \
            --skip-path .venv \
            --skip-path venv \
            --skip-path __pycache__ \
            --skip-path .git \
            --skip-path artifacts \
            --skip-path data/state \
            --skip-path node_modules \
            --quiet \
            --compact \
            --soft-fail

      - name: Scan Dockerfiles if present
        run: |
          find . -name "Dockerfile*" \
            ! -path "./.git/*" \
            ! -path "./.venv/*" \
            ! -path "./venv/*" \
            ! -path "./node_modules/*" \
            ! -path "./artifacts/*" \
            ! -path "./data/state/*" \
            | while read -r f; do
              echo "Checkov: $f"
              checkov -f "$f" \
                --framework dockerfile \
                --quiet \
                --compact \
                --soft-fail
            done

  filesystem-scan:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    continue-on-error: true
    # Non bloquant volontairement au départ: --exit-code 0 évite de casser la CI
    # pendant la stabilisation. Durcissement futur recommandé: --exit-code 1
    # sur CRITICAL, puis éventuellement HIGH,CRITICAL.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install Trivy CLI
        run: |
          curl -sSfL \
            https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin
          trivy --version

      - name: Trivy filesystem scan
        run: |
          trivy fs . \
            --severity CRITICAL,HIGH \
            --exit-code 0 \
            --ignore-unfixed \
            --skip-dirs .venv \
            --skip-dirs venv \
            --skip-dirs __pycache__ \
            --skip-dirs .git \
            --skip-dirs artifacts \
            --skip-dirs data/state \
            --skip-dirs node_modules \
            --format sarif \
            --output trivy-results.sarif

      - name: Upload Trivy SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results
          path: trivy-results.sarif
        continue-on-error: true

  actions-integrity:
    name: Actions SHA pinning check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Detect floating action references
        run: |
          echo "Scan des workflows pour actions non epinglees..."
          find .github/workflows/ -name "*.yml" | while read -r wf; do
            echo "--- $wf ---"
            grep -n "uses:" "$wf" \
              | grep -v "@[a-f0-9]\{40\}" \
              | while read -r line; do
                echo "WARN tag flottant : $line"
              done
          done
          echo "Scan termine"
        continue-on-error: true
